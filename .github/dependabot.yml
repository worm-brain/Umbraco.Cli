# Dependabot keeps the dependencies current, once a month. Minor and patch updates arrive as one grouped
# pull request per ecosystem, so they cost one CI run each. Major updates are left out of the groups and
# arrive one pull request each, so a breaking one fails on its own instead of holding back the group.
# The workflows pin actions to full commit SHAs with the tag in a trailing comment; Dependabot moves the
# SHA and the comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: ci

  # Every .NET project, through Directory.Packages.props (central package management).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build
