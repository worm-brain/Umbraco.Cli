# Releases a version when its tag is pushed: `git tag v0.2.0 && git push origin v0.2.0`. The tag sets the
# package version, so the tag and the published version cannot drift apart. Tags with a suffix
# (v0.2.0-rc.1) are pre-releases. The package is `Umbraco.Community.Cli` (the `Umbraco.` prefix is
# reserved on nuget.org); the command it installs is `umbraco`.
#
# The jobs run in order, and each one runs only when the ones before it passed:
#   1. security        the Security workflow (security.yml) as a gate.
#   2. test            the tests on Linux, Windows and macOS. Routine CI is Linux-only, to save minutes;
#                      a release is where cross-platform confidence matters.
#      pack            (alongside test) reads the version's CHANGELOG.md section, then packs the tool at
#                      the tag's version.
#   3. publish         pushes the package to nuget.org.
#   4. github-release  creates the GitHub Release for the tag, with that version's CHANGELOG.md section
#                      as its notes and the .nupkg attached.
#
# Publishing uses NuGet trusted publishing, so no API key is stored: the publish job exchanges its GitHub
# OIDC token for a short-lived key. One-off setup per repository: a trusted publishing policy on nuget.org
# for this repository and release.yml, the `nuget` environment with deployments limited to `v*` tags, and
# the repository variable NUGET_USER (the nuget.org account name).
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: read-only by default, and a job that needs more widens its own: the security gate
# (CodeQL uploads its results), publish (mints an OIDC token) and github-release (writes the release).
# Jobs that restore or build run third-party package code, so none of them can publish or write contents.
#
# Actions are pinned to full commit SHAs (tag in the trailing comment) so a moved tag cannot change what
# runs next to the publishing credentials. Dependabot keeps the pins current.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  security:
    name: Security gate
    uses: ./.github/workflows/security.yml
    # What the called workflow's CodeQL job asks for. GitHub checks a called workflow's permissions when
    # the run starts, before any `if:`, so they are needed even where CodeQL is skipped. None can publish.
    permissions:
      contents: read
      actions: read
      security-events: write

  test:
    name: Test (${{ matrix.os }})
    needs: security
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet test --solution Umbraco.Community.Cli.slnx -c Release

  pack:
    needs: security
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The tag sets the version: v0.2.0 -> 0.2.0, v0.2.0-rc.1 -> 0.2.0-rc.1.
      - name: Resolve the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The release notes are the CHANGELOG.md section whose heading names this version in brackets
      # (`## [0.2.0] - 2026-11-02`). Read here, before anything is published, so a missing section stops
      # the release early.
      - name: Read the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Prints the lines after the first `## ` heading that contains `[<version>]`, up to the next
          # `## ` heading, and exits 1 when no heading names the version.
          if ! awk -v needle="[$VERSION]" '
            /^## / { if (found) exit; found = (index($0, needle) > 0); next }
            found { print }
            END { exit !found }
          ' CHANGELOG.md > release-notes.md; then
            echo "::error::CHANGELOG.md has no '## ' heading containing [$VERSION]. Move the Unreleased entries under a heading for this version in the commit you tag."
            exit 1
          fi
          cat release-notes.md

      # Produces the .nupkg with its .snupkg symbol package.
      - run: dotnet pack Umbraco.Community.Cli.slnx -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: [test, pack]
    runs-on: ubuntu-latest
    # The environment accepts deployments from `v*` tags only.
    environment: nuget
    permissions:
      contents: read
      id-token: write # request the OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages
          path: artifacts/

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing a .nupkg also pushes the matching .snupkg from the same folder. No --skip-duplicate: a
      # rejected push must fail the job rather than pass silently. (It once hid the reserved `Umbraco.`
      # prefix's 409 behind a green run while nothing was published.)
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  github-release:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages
          path: artifacts/

      # A version with a `-` suffix (0.2.0-rc.1) is marked as a pre-release. The .nupkg is attached, as
      # on every release so far.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
