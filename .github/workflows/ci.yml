name: CI

# Routine CI runs tests on Linux only, to keep GitHub Actions minutes down:
# GitHub bills macOS runners at 10x and Windows at 2x Linux minutes, so a 3-OS
# matrix costs ~13x a Linux-only run. Cross-platform is still verified where it
# matters - the release workflow (publish.yml) gates every tag on the full
# ubuntu/windows/macos matrix, and a manual `workflow_dispatch` here runs the
# full matrix on demand.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - "tests/hands-on/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - "tests/hands-on/**"
  # Run the full cross-platform matrix on demand (Actions tab -> CI -> Run workflow).
  workflow_dispatch:

# A newer push to the same branch/PR cancels the in-progress run, so rapid
# pushes don't stack up parallel runs and burn minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (SEC-CICD-003): the build runs third-party package code via restore/
# build/test and needs only to read the repo. Pinned here so a change to the repo's
# default token setting can never widen it.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux only for routine PR/push runs; the full matrix only on a manual
      # workflow_dispatch (the expression yields a JSON array either way).
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger trx --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Pack
        run: dotnet pack src/Umbraco.Cli/Umbraco.Cli.csproj -c Release -o ./nupkg

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./nupkg
