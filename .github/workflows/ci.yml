# Formats, builds, tests and packs the CLI on every pull request that changes code (not on pushes, to
# save Actions minutes). Linux only: the release workflow (release.yml) runs the tests on Linux,
# Windows and macOS before anything is published.
name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

# Least privilege: the build runs third-party package code (restore, build, test) and only reads the repo.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from global.json so CI and local builds use the same SDK band.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build Umbraco.Community.Cli.slnx -c Release -warnaserror

      # The live integration tests skip themselves here: CI has no Umbraco site.
      - name: Test
        run: dotnet test --solution Umbraco.Community.Cli.slnx --no-build -c Release --report-xunit-trx --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      # The tool package and its symbols package; the projects that are not packable are skipped.
      - run: dotnet pack Umbraco.Community.Cli.slnx --no-build -c Release -o artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/
