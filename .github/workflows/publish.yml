name: Release

# Publishes the `Umbraco.Community.Cli` global tool package to NuGet.org.
# (The `Umbraco.*` prefix is reserved by Umbraco A/S; community packages use
# the shared `Umbraco.Community.*` namespace. The CLI command is `umbraco`.)
#
# Triggered by pushing a version tag of the form `vMAJOR.MINOR.PATCH`
# (e.g. `v1.0.0`). The tag drives the package version, so the git tag and
# the published NuGet version can never drift apart:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# Authentication uses NuGet.org Trusted Publishing (OIDC) -- no long-lived
# API key secret is stored in this repo. At push time the workflow requests a
# short-lived GitHub OIDC token, exchanges it with NuGet.org via the
# `NuGet/login` action, and receives a temporary API key valid for ~1 hour.
#
# One-time setup on nuget.org (Account -> Trusted Publishing -> add policy):
#   - Repository Owner: worm-brain
#   - Repository:       Umbraco.Cli
#   - Workflow File:    publish.yml   (file name only, no path)
#   - Environment:      (leave empty -- this workflow uses no GH environment)
# and add a repo secret `NUGET_USER` = your nuget.org username (profile name,
# NOT your email). See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"      # stable releases, e.g. v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]+-*"    # prereleases, e.g. v1.1.0-rc.1

# Least privilege by default (SEC-CICD-001). The `test` matrix and the security gate run
# `dotnet restore`/build, i.e. third-party package code, so they must NOT hold
# `id-token: write` - the Trusted Publishing policy is scoped to this workflow file with no
# environment, so ANY job here holding it could mint an OIDC token NuGet.org would accept.
# Only the `release` job widens its permissions, below.
#
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment) so a
# repointed tag cannot change what runs next to the publish credentials.
permissions:
  contents: read

jobs:
  # Tier-1 security gate (NuGet vulnerabilities, secret scan, package hygiene), run
  # in-graph as a reusable workflow so `release` can `needs:` it (SEC-CICD-002). A
  # separate Security run on the same tag would be a parallel, non-blocking signal.
  # CodeQL is skipped here: code scanning is not enabled on this private repo, so it would
  # fail every release. It still runs on PRs, main and the weekly schedule.
  security:
    name: Security gate
    uses: ./.github/workflows/security.yml
    with:
      skip-codeql: true
    # These grants are still needed although CodeQL is skipped: GitHub validates a called
    # workflow's job permissions against the caller when the run starts, before any `if:`,
    # so without them the whole Release run fails to start. None of them can publish.
    permissions:
      contents: read
      actions: read
      security-events: write


  # Cross-platform gate: a tag is published only if the tests pass on every OS.
  # Releases are rare, so the full ubuntu/windows/macos matrix runs here - where
  # routine CI (ci.yml) is Linux-only - because a release is where cross-platform
  # confidence matters most.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  release:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest
    # Only publish once BOTH the cross-platform test matrix and the Tier-1 security gate
    # are green. A failed or skipped dependency skips this job, so nothing ships.
    needs: [test, security]
    # The only job holding write scopes (SEC-CICD-001).
    permissions:
      contents: write # create-github-release step attaches the .nupkg to a Release
      id-token: write # Trusted Publishing: mint the GitHub OIDC token for NuGet/login

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      # Derive the package version from the tag: strip the leading `v`.
      # `v1.2.3` -> `1.2.3`, `v1.2.3-rc.1` -> `1.2.3-rc.1`.
      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      # No inline test step here: the `test` job above already gated this publish
      # on a green run across ubuntu/windows/macos, so we never ship a broken tool.
      - name: Pack
        run: >
          dotnet pack src/Umbraco.Cli/Umbraco.Cli.csproj
          --no-build -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o ./nupkg

      # Exchange the GitHub OIDC token for a short-lived NuGet API key. Done
      # immediately before the push because the key expires after ~1 hour.
      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # NOTE: deliberately NO `--skip-duplicate` here. That flag treats a 409
      # "already exists" as success, which previously masked a real rejection
      # (the reserved `Umbraco.*` prefix returned a conflict and the run still
      # went green while nothing published). We want the push to FAIL LOUDLY on
      # any conflict/rejection. Each release uses a unique tag-derived version,
      # so a legitimate duplicate should never occur; if it does, that is a
      # signal worth failing on rather than hiding.
      - name: Push to NuGet.org
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: ./nupkg

      # Create a GitHub Release for the tag, attaching the .nupkg. Marked as a
      # prerelease automatically when the version contains a `-` suffix.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
